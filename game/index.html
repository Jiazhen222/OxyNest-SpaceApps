<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network requests: scripts, styles and images come only from this folder; fetch/XHR are blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>OxyNest Moon Base</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e4e6ef' stroke='%231b2450' stroke-width='3'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%23a7abbe'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23a7abbe'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="stage" class="on-start">
  <div id="sceneWrap"></div>

  <!-- top bar with stats (game screen only) -->
  <div id="hud" aria-label="Stats">
    <div class="stat meter wide" data-k="survival"></div>
    <div class="stat meter" data-k="air"></div>
    <div class="stat meter" data-k="power"></div>
    <div class="stat meter" data-k="water"></div>
    <div class="stat meter" data-k="food"></div>
    <div class="stat meter" data-k="rad"></div>
    <div class="stat count" data-k="rocks"></div>
    <div class="stat count" data-k="stars"></div>
  </div>

  <!-- top right on every screen -->
  <div id="corner">
    <button id="homeBtn" class="iconbtn" type="button"></button>
    <button id="muteBtn" class="iconbtn" type="button"></button>
    <div class="lang" role="group">
      <button type="button" data-lang="en">EN</button><span class="sep" aria-hidden="true">|</span><button type="button" data-lang="zh" lang="zh-Hans">中文</button>
    </div>
  </div>

  <!-- start screen -->
  <div id="start">
    <div class="title"><span class="t1" data-t="app.name"></span><span class="t2" data-t="app.sub"></span></div>
    <div id="levelCards"></div>
    <div class="nick card">
      <label for="nickInput" class="nlabel" data-t="start.nick"></label>
      <div class="nrow">
        <input id="nickInput" type="text" maxlength="12" autocomplete="off" spellcheck="false">
        <div class="chips"></div>
      </div>
      <div class="nhint" data-t="start.nickHint"></div>
    </div>
  </div>

  <!-- the guide: mascot + one big Next step banner -->
  <div id="guide">
    <div class="gmascot" id="gMascot"></div>
    <div class="banner" aria-live="polite">
      <span class="bicon" id="bIcon"></span>
      <span class="btext" id="bText"></span>
    </div>
    <button id="helpBtn" class="iconbtn big" type="button"></button>
  </div>
  <div id="bubble" class="card" aria-live="polite" hidden></div>
  <div id="warn" hidden></div>

  <!-- bottom buttons -->
  <div id="actions">
    <button id="btnGo" class="btn abtn" type="button" hidden></button>
    <button id="btnIce" class="btn abtn" type="button" hidden></button>
    <button id="btnProc" class="btn abtn" type="button" hidden></button>
    <button id="btnBook" class="btn abtn" type="button" hidden></button>
  </div>
  <div id="digbar" hidden>
    <div class="bag card" id="bag"></div>
    <button id="btnBlow" class="btn abtn" type="button" hidden></button>
    <button id="btnBack" class="btn abtn secondary" type="button"></button>
  </div>

  <div id="modalBack" hidden><div id="modal" class="card" role="dialog" aria-modal="true"></div></div>
  <div id="fly" aria-hidden="true"></div>
  <div id="pointer" aria-hidden="true" hidden></div>
</div>
<noscript><p style="color:#fff8e8;font:18px sans-serif;padding:24px">This game needs JavaScript turned on. 这个游戏需要开启 JavaScript。</p></noscript>
<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/sfx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
